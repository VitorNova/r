<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug LeadboxCRM</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
        }
        h1, h2, h3 {
            color: #00ff00;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #1a4d1a; }
        .error { background: #4d1a1a; }
        .warning { background: #4d4d1a; }
        pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border-left: 4px solid #00ff00;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #1e1e1e;
        }
        th, td {
            border: 1px solid #00ff00;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #0d3d0d;
        }
        .btn {
            background: #00ff00;
            color: #1e1e1e;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin: 10px 5px;
        }
        .btn:hover {
            background: #00cc00;
        }
        .info-box {
            background: #0d3d0d;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            border-left: 4px solid #00ff00;
        }
        .count {
            font-size: 2em;
            font-weight: bold;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug LeadboxCRM - Análise Completa</h1>

        <div style="text-align: center; margin: 20px 0;">
            <button class="btn" onclick="loadData()">🔄 Recarregar Dados</button>
            <button class="btn" onclick="copyToClipboard()">📋 Copiar JSON</button>
        </div>

        <div id="status" class="status">Conectando ao Supabase...</div>

        <div id="summary"></div>
        <div id="structure"></div>
        <div id="data"></div>
        <div id="raw"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://uaepkqqgagcuvgitakiz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhZXBrcXFnYWdjdXZnaXRha2l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1MDU1MTksImV4cCI6MjA3MjA4MTUxOX0.WCAEolWKmOvEuEVfb_D6BRNa2rBWcdqZ-WT8pGPG9e0';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allData = [];

        window.onload = loadData;

        async function loadData() {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status warning';
            statusEl.textContent = '⏳ Carregando dados da tabela LeadboxCRM...';

            try {
                // Buscar TODOS os dados
                const { data, error } = await supabase
                    .from('LeadboxCRM')
                    .select('*');

                if (error) throw error;

                allData = data || [];

                statusEl.className = 'status success';
                statusEl.textContent = `✅ Sucesso! ${allData.length} registros carregados`;

                renderSummary();
                renderStructure();
                renderData();
                renderRaw();

            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = `❌ Erro: ${error.message}`;

                document.getElementById('summary').innerHTML = `
                    <div class="info-box">
                        <h3>❌ Erro ao carregar dados</h3>
                        <p><strong>Mensagem:</strong> ${error.message}</p>
                        <p><strong>Código:</strong> ${error.code || 'N/A'}</p>
                        <p><strong>Detalhes:</strong> ${error.details || 'N/A'}</p>

                        <h4>Possíveis causas:</h4>
                        <ul>
                            <li>Tabela "LeadboxCRM" não existe</li>
                            <li>Políticas RLS (Row Level Security) bloqueando acesso</li>
                            <li>Credenciais incorretas</li>
                            <li>Permissões insuficientes</li>
                        </ul>

                        <h4>Solução:</h4>
                        <ol>
                            <li>Verifique se a tabela existe no Supabase (Table Editor)</li>
                            <li>Vá em Authentication > Policies</li>
                            <li>Adicione uma política de SELECT para a tabela LeadboxCRM</li>
                        </ol>
                    </div>
                `;
            }
        }

        function renderSummary() {
            const el = document.getElementById('summary');

            if (allData.length === 0) {
                el.innerHTML = `
                    <div class="info-box">
                        <h2>📊 Resumo</h2>
                        <p class="count">0 registros</p>
                        <p>⚠️ A tabela LeadboxCRM existe mas está vazia.</p>
                    </div>
                `;
                return;
            }

            const columns = Object.keys(allData[0]);
            const hasStatus = columns.includes('status');
            const hasName = columns.some(c => c.toLowerCase().includes('name') || c.toLowerCase().includes('nome'));
            const hasPhone = columns.some(c => c.toLowerCase().includes('phone') || c.toLowerCase().includes('tel'));

            let statusDistribution = {};
            if (hasStatus) {
                allData.forEach(item => {
                    const status = item.status || 'null';
                    statusDistribution[status] = (statusDistribution[status] || 0) + 1;
                });
            }

            el.innerHTML = `
                <div class="info-box">
                    <h2>📊 Resumo dos Dados</h2>
                    <p><span class="count">${allData.length}</span> registros encontrados</p>
                    <p><strong>Colunas:</strong> ${columns.length} (${columns.join(', ')})</p>
                    <p><strong>Tem campo "status"?</strong> ${hasStatus ? '✅ Sim' : '❌ Não'}</p>
                    <p><strong>Tem campo de nome?</strong> ${hasName ? '✅ Sim' : '❌ Não'}</p>
                    <p><strong>Tem campo de telefone?</strong> ${hasPhone ? '✅ Sim' : '❌ Não'}</p>

                    ${hasStatus ? `
                        <h3>Distribuição por Status:</h3>
                        <table>
                            <tr><th>Status</th><th>Quantidade</th></tr>
                            ${Object.entries(statusDistribution).map(([status, count]) =>
                                `<tr><td>${status}</td><td>${count}</td></tr>`
                            ).join('')}
                        </table>
                    ` : `
                        <p style="color: #ff9900;">⚠️ Sem campo "status" - Todos os leads aparecerão como "Novo"</p>
                    `}
                </div>
            `;
        }

        function renderStructure() {
            const el = document.getElementById('structure');

            if (allData.length === 0) {
                el.innerHTML = '';
                return;
            }

            const firstRecord = allData[0];
            const columns = Object.keys(firstRecord);

            el.innerHTML = `
                <h2>🗂️ Estrutura da Tabela (${columns.length} colunas)</h2>
                <table>
                    <tr>
                        <th>#</th>
                        <th>Nome da Coluna</th>
                        <th>Tipo</th>
                        <th>Exemplo de Valor</th>
                        <th>Valores Únicos</th>
                    </tr>
                    ${columns.map((col, index) => {
                        const value = firstRecord[col];
                        const type = typeof value;
                        const uniqueValues = [...new Set(allData.map(item => item[col]))].length;

                        return `
                            <tr>
                                <td>${index + 1}</td>
                                <td><strong>${col}</strong></td>
                                <td>${type}</td>
                                <td>${value !== null ? String(value).substring(0, 50) : 'null'}</td>
                                <td>${uniqueValues}</td>
                            </tr>
                        `;
                    }).join('')}
                </table>
            `;
        }

        function renderData() {
            const el = document.getElementById('data');

            if (allData.length === 0) {
                el.innerHTML = '';
                return;
            }

            const columns = Object.keys(allData[0]);

            el.innerHTML = `
                <h2>📋 Dados Completos (${allData.length} registros)</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <tr>
                            <th>#</th>
                            ${columns.map(col => `<th>${col}</th>`).join('')}
                        </tr>
                        ${allData.map((item, index) => `
                            <tr>
                                <td>${index + 1}</td>
                                ${columns.map(col => {
                                    const value = item[col];
                                    const displayValue = value !== null && value !== undefined
                                        ? String(value).substring(0, 100)
                                        : '<em>null</em>';
                                    return `<td>${displayValue}</td>`;
                                }).join('')}
                            </tr>
                        `).join('')}
                    </table>
                </div>
            `;
        }

        function renderRaw() {
            const el = document.getElementById('raw');

            if (allData.length === 0) {
                el.innerHTML = '';
                return;
            }

            el.innerHTML = `
                <h2>📄 JSON Bruto (para debug)</h2>
                <pre id="json-raw">${JSON.stringify(allData, null, 2)}</pre>
            `;
        }

        function copyToClipboard() {
            const json = JSON.stringify(allData, null, 2);
            navigator.clipboard.writeText(json).then(() => {
                alert('✅ JSON copiado para a área de transferência!');
            }).catch(err => {
                alert('❌ Erro ao copiar: ' + err);
            });
        }
    </script>
</body>
</html>
